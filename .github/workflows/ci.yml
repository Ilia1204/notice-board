name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - name: Модульные тесты с покрытием
        run: npm run test:cov
      - name: Интеграционные тесты
        if: matrix.project == 'backend'
        run: npm run test:e2e
      - name: Отчёт о тестах
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Тесты (${{ matrix.project }})
          path: ${{ matrix.project }}/reports/*.xml
          reporter: java-junit
      - name: Покрытие в сводку
        if: always()
        run: |
          echo "### Покрытие кода: ${{ matrix.project }}" >> "$GITHUB_STEP_SUMMARY"
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| Строки | Ветвления | Функции |\n|---|---|---|\n| '+t.lines.pct+'% | '+t.branches.pct+'% | '+t.functions.pct+'% |')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/coverage/
            ${{ matrix.project }}/reports/

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notice
          POSTGRES_PASSWORD: notice
          POSTGRES_DB: notice_board
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://notice:notice@localhost:5432/notice_board
      JWT_SECRET: e2e-secret
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend && npm ci --prefix e2e
      - name: Подготовка базы данных
        working-directory: backend
        run: npx prisma migrate deploy && npx ts-node prisma/seed.ts
      - name: Браузер Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Проверка кода тестов
        working-directory: e2e
        run: npm run lint && npm run format:check
      - name: Тесты от лица пользователя
        working-directory: e2e
        run: npm test
      - name: Отчёт о тестах
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Тесты (e2e)
          path: e2e/reports/*.xml
          reporter: java-junit
      - name: Итоги в сводку
        if: always()
        working-directory: e2e
        run: node summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/reports/

  build:
    name: build (${{ matrix.project }})
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-dist
          path: ${{ matrix.project }}/dist/

  metrics:
    name: metrics
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - uses: actions/download-artifact@v4
        with:
          name: test-reports-backend
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: test-reports-frontend
          path: frontend
      - name: Сбор метрик
        run: npm run metrics
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/
